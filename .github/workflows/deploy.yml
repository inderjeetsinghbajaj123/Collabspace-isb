name: Build Frontend and Prepare Backend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm install

      # 4. Build frontend
      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      # 5. Copy build to backend/public
      - name: Copy build to backend
        run: |
          rm -rf Backend/public
          mkdir -p Backend/public
          cp -r Frontend/dist/* Backend/public 2>/dev/null || cp -r Frontend/build/* Backend/public

      # 6. Install backend dependencies
      - name: Install backend dependencies
        working-directory: Backend
        run: npm install